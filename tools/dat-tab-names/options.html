<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Email al broker — Dispatch Up</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; background: #f8fafd; font: 14px/1.45 "Google Sans", Roboto, system-ui, sans-serif; color: #1f1f1f; }
    main { max-width: 760px; margin: 32px auto; padding: 0 16px; }
    h1 { font-size: 22px; font-weight: 500; margin: 0 0 4px; }
    p.sub { color: #444746; margin: 0 0 20px; }
    .card { background: #fff; border: 1px solid #e3e3e3; border-radius: 16px; padding: 20px; margin-bottom: 16px;
      box-shadow: 0 1px 2px rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15); }
    label { display: block; font-size: 12px; font-weight: 500; color: #444746; margin: 14px 0 6px; }
    label:first-child { margin-top: 0; }
    input, textarea { width: 100%; box-sizing: border-box; border: 1px solid #c4c7c5; border-radius: 8px; padding: 10px 12px;
      font: inherit; color: inherit; background: #fff; }
    input:focus, textarea:focus { outline: 2px solid #0b57d0; border-color: transparent; }
    textarea { min-height: 220px; resize: vertical; }
    .hint { font-size: 12px; color: #444746; margin-top: 6px; }
    .vars { display: flex; flex-wrap: wrap; gap: 6px; }
    .var { border: 1px solid #c4c7c5; background: #fff; border-radius: 8px; padding: 4px 10px; font: 500 12px/1.4 inherit; cursor: pointer; color: #0b57d0; }
    .var:hover { background: #f0f4f9; }
    .actions { display: flex; gap: 8px; align-items: center; }
    button.primary { background: #0b57d0; color: #fff; border: 0; border-radius: 999px; padding: 10px 22px; font: 500 14px inherit; cursor: pointer; }
    button.primary:hover { background: #0842a0; }
    button.text { background: transparent; color: #0b57d0; border: 0; padding: 10px 12px; font: 500 14px inherit; cursor: pointer; border-radius: 999px; }
    button.text:hover { background: #f0f4f9; }
    .modes { display: grid; gap: 8px; }
    label.mode { display: flex; gap: 10px; align-items: flex-start; margin: 0; font-size: 14px; font-weight: 400; color: #1f1f1f;
      border: 1px solid #e3e3e3; border-radius: 12px; padding: 10px 12px; cursor: pointer; }
    label.mode:has(input:checked) { border-color: #0b57d0; background: #f0f4f9; }
    label.mode input { width: auto; margin-top: 3px; }
    .row { display: flex; gap: 8px; align-items: center; }
    .ok { color: #188038 !important; } .bad { color: #d93025 !important; }
    #saved { color: #188038; font-weight: 500; opacity: 0; transition: opacity .2s; }
    pre { white-space: pre-wrap; margin: 0; font: inherit; background: #f0f4f9; border-radius: 12px; padding: 14px; }
    .subject { font-weight: 500; margin-bottom: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>Email al broker</h1>
    <p class="sub">El botón <b>✉ Email</b> en el detalle de la carga de DAT le escribe al broker con esta plantilla.</p>

    <div class="card">
      <label>Cómo se envía</label>
      <div class="modes">
        <label class="mode"><input type="radio" name="mode" value="direct"> <span><b>Enviar directo</b> desde <b>58logisticsllc@gmail.com</b>, con 5 segundos para deshacer</span></label>
        <label class="mode"><input type="radio" name="mode" value="gmail"> <span><b>Abrir en Gmail</b> para revisarlo y enviarlo a mano</span></label>
      </div>

      <div id="directBox">
        <label for="key">Clave de Dispatch Up</label>
        <div class="row">
          <input id="key" type="password" placeholder="La misma clave del asistente de RTS (TMS → Companies → Asistente RTS)" autocomplete="off">
          <button class="text" id="test" type="button">Probar</button>
        </div>
        <div class="hint" id="keyStatus">Se guarda solo en este Chrome.</div>
      </div>

      <div id="gmailBox">
        <label for="from">Abrir con la cuenta de Gmail</label>
        <input id="from" type="email" placeholder="tu-correo@gmail.com">
        <div class="hint">Tiene que tener sesión abierta en este Chrome. Vacío = la cuenta principal de Gmail.</div>
      </div>
    </div>

    <div class="card">

      <label for="subject">Asunto</label>
      <input id="subject" type="text">

      <label for="body">Mensaje</label>
      <textarea id="body"></textarea>

      <label>Variables (clic para insertar donde está el cursor)</label>
      <div class="vars" id="vars"></div>
    </div>

    <div class="card">
      <label>Vista previa (carga de ejemplo)</label>
      <pre id="preview"></pre>
    </div>

    <div class="actions">
      <button class="primary" id="save">Guardar</button>
      <button class="text" id="reset">Restaurar plantilla original</button>
      <span id="saved">Guardado ✓</span>
    </div>
  </main>
  <script src="email-template.js"></script>
  <script src="options.js"></script>
</body>
</html>
